name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened] # closing is close-preview.yml
    branches:
      - main

# Least privilege by default. Jobs that need something else declare it themselves.
permissions:
  contents: read

# Serialise all runs for a given pull request, including close-preview.yml, which
# uses the same group. Without this the close run - fired on merge - can start while
# that PR's preview deploy is still in flight, report "No matching Static Web App
# environment was found", exit 0, and then the deploy finishes and creates an
# environment nothing will ever clean up. Three orphans accumulated that way and
# exhausted the free tier's three-environment limit.
#
# cancel-in-progress is deliberately false: cancelling the deploy would leave the
# environment half-created rather than not created.
concurrency:
  group: swa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  # Gate. The deploy job builds via Oryx inside the SWA action and would happily
  # ship a solution whose tests fail, so the tests have to run and pass here
  # first. ci.yml covers the same ground for pull requests, but a green CI run
  # does not block this workflow - only "needs" does.
  test:
    runs-on: ubuntu-latest
    name: Test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Otherwise the job token is saved in .git/config, readable by every later
          # step: package build scripts during restore, and the deploy action's image.
          # Nothing here needs it there; the deploy action is given its token directly.
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "8.0.x"

      - name: Build and test
        uses: ./.github/actions/build-and-test

  build_and_deploy_job:
    needs: test
    # Runs triggered by Dependabot, or by a pull request from a fork, cannot read
    # repository secrets, so the deployment token is empty and the deploy fails.
    # Skipping the job outright is the only thing that works - the action has no
    # "skip on missing secrets" input, despite the name suggesting otherwise.
    #
    # Pull requests opened by Dependabot never get a preview, even when a person
    # triggers the run. Dependabot closes its own pull requests, and that run has
    # no token to remove a preview with - see close-preview.yml.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        !github.event.pull_request.head.repo.fork))
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read
      pull-requests: write # the action comments the preview URL on the pull request
    steps:
      # A run that starts after its pull request closed - re-run later, or started
      # late - would create a preview that no event is left to remove. Closing while
      # this job is running is fine: the close waits in the concurrency group.
      - name: Check the pull request is still open
        id: pr
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .state)
          echo "state=$state" >> "$GITHUB_OUTPUT"
          if [ "$state" != "open" ]; then
            echo "::notice::Pull request $PR is $state, so no preview is deployed."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Otherwise the job token is saved in .git/config, readable by every later
          # step: package build scripts during restore, and the deploy action's image.
          # Nothing here needs it there; the deploy action is given its token directly.
          persist-credentials: false
      # For the check after the deploy: the site's Last-Modified must be later than this.
      - name: Note when the deploy starts
        if: github.event_name == 'push' || steps.pr.outputs.state == 'open'
        run: echo "DEPLOY_STARTED=$(date -u +%s)" >> "$GITHUB_ENV"
      # Pinned to a commit like every action here; see close-preview.yml for what
      # that does and does not freeze for this one.
      - name: Build And Deploy
        id: builddeploy
        if: github.event_name == 'push' || steps.pr.outputs.state == 'open'
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_COAST_0312A8E0F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "src/Portfolio.Client" # App source code path
          api_location: "src/Portfolio.Api" # Api source code path - optional
          output_location: "wwwroot" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

      # "Deployment Complete" says the upload finished, not that the site works. This
      # checks the environment just deployed - production on main, the preview on a pull
      # request - the way a visitor and a caller see it:
      #   - pages, including a deep link, answer with the app, so the routes in
      #     staticwebapp.config.json are in effect (at the repo root it is silently ignored)
      #   - an unknown address answers 404, still with the app so it can say "Page not
      #     found", rather than a 200 that search engines would index as a page
      #   - each has the Content-Security-Policy, so the config's headers are in effect too
      #   - each has a Last-Modified from this deploy, not the one it replaced
      #   - an API answers, with the validation the site expects: an invalid message gets
      #     400 naming the three fields, with the API's own nosniff and no-store
      #     headers. It cannot tell this deploy's API from the last one, which would
      #     answer the same. NEVER a valid message: that is a real submission
      # /projects/vam and the three field names are copies: change them here if Väm's
      # route or the contact form's fields change (listed in CLAUDE.md).
      # Retried, since a new deploy and a cold API can take a moment to answer.
      - name: Check the deployed site
        if: steps.builddeploy.outcome == 'success'
        env:
          SITE: ${{ steps.builddeploy.outputs.static_web_app_url }}
        run: |
          if [ -z "$SITE" ]; then
            echo "::error::The deploy step reported no site URL, so there is nothing to check."
            exit 1
          fi
          if [ -z "${DEPLOY_STARTED:-}" ]; then
            echo "::error::DEPLOY_STARTED is not set, so this deploy cannot be told from the last."
            exit 1
          fi
          SITE="${SITE%/}"
          body=$(mktemp)
          headers=$(mktemp)
          attempts=12

          # Prints what is wrong and fails, or succeeds when everything answers as it should.
          check() {
            # Headers are checked per page: each request overwrites the file.
            for path in / /projects/vam; do
              code=$(curl -s -m 30 -D "$headers" -o "$body" -w '%{http_code}' "$SITE$path") || code=000
              if [ "$code" != 200 ] || ! grep -q '<div id="app">' "$body"; then
                echo "GET $path answered $code without the app."
                return 1
              fi

              if ! grep -qi '^content-security-policy:' "$headers"; then
                echo "GET $path has no Content-Security-Policy, so staticwebapp.config.json is not in effect."
                return 1
              fi

              # A header that is missing or will not parse counts as old: a failed
              # comparison inside [ ] is false, and would pass without checking anything.
              modified=$(grep -i '^last-modified:' "$headers" | cut -d' ' -f2- | tr -d '\r')
              modified_at=$(date -u -d "$modified" +%s 2>/dev/null) || modified_at=0
              if [ -z "$modified" ] || [ "$modified_at" -lt "$DEPLOY_STARTED" ]; then
                echo "GET $path has Last-Modified '${modified:-missing}', from before this deploy started."
                return 1
              fi
            done

            code=$(curl -s -m 30 -o "$body" -w '%{http_code}' "$SITE/no-such-page-deploy-check") || code=000
            if [ "$code" != 404 ] || ! grep -q '<div id="app">' "$body"; then
              echo "GET /no-such-page-deploy-check answered $code; expected 404 with the app."
              return 1
            fi

            code=$(curl -s -m 30 -D "$headers" -o "$body" -w '%{http_code}' -X POST \
              -H 'Content-Type: application/json' \
              -d '{"name":"","email":"x","message":"y"}' \
              "$SITE/api/contact") || code=000
            fields=$(jq -c '[.errors[].field] | sort' "$body" 2>/dev/null)
            if [ "$code" != 400 ] || [ "$fields" != '["Email","Message","Name"]' ]; then
              echo "POST /api/contact answered $code with fields ${fields:-none}: $(head -c 200 "$body")"
              return 1
            fi

            # The API sets these itself, since globalHeaders do not reach it.
            if ! grep -qi '^x-content-type-options: *nosniff' "$headers" || ! grep -qi '^cache-control: *no-store' "$headers"; then
              echo "POST /api/contact is missing X-Content-Type-Options: nosniff or Cache-Control: no-store."
              return 1
            fi
          }

          for attempt in $(seq 1 "$attempts"); do
            if result=$(check); then
              echo "$SITE answers as it should."
              exit 0
            fi
            echo "Attempt $attempt: $result"
            # Not after the last: it would only hold the concurrency group, and with it a
            # queued preview close, for nothing.
            if [ "$attempt" -lt "$attempts" ]; then
              sleep 10
            fi
          done
          echo "::error::$SITE failed its checks after $attempts attempts. Last: $result"
          exit 1
