name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the token only needs to read the code.
permissions:
  contents: read

# CI has no side effects, so superseding an in-flight run on a new push is safe
# and avoids paying for work nobody will read.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          # Deliberately not pinned to a patch version: global.json holds a
          # floor (8.0.100, rollForward latestMinor), so any 8.0.x SDK satisfies it.
          dotnet-version: "8.0.x"

      - name: Build and test
        uses: ./.github/actions/build-and-test

      - name: Check formatting
        # EnforceCodeStyleInBuild is off so style never fails a local build.
        # CI is where .editorconfig is actually enforced.
        run: dotnet format Portfolio.sln --verify-no-changes --verbosity minimal

      - name: Check for vulnerable packages
        # Advisory only - a new CVE should not break an unrelated PR, but it
        # should be visible in the log.
        continue-on-error: true
        run: dotnet list Portfolio.sln package --vulnerable --include-transitive
