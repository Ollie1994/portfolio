name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI has no side effects, so superseding an in-flight run on a new push is safe
# and avoids paying for work nobody will read.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          # Deliberately not pinned to a patch version: global.json holds a
          # floor (8.0.0, rollForward latestMinor), so any 8.0.x SDK satisfies it.
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Portfolio.sln

      - name: Build
        # No implicit restore, so a restore failure is reported as its own step.
        run: dotnet build Portfolio.sln --configuration Release --no-restore

      - name: Test
        # dotnet test exits 0 when it discovers no tests at all, so a green tick
        # here does not by itself mean anything was verified. This check is
        # required before merging to main, so it asserts a non-zero passed count
        # rather than trusting the exit code.
        run: |
          set -o pipefail
          dotnet test Portfolio.sln --configuration Release --no-build --verbosity normal | tee test-output.txt
          if ! grep -Eq 'Passed! *- *Failed: *[0-9]+, *Passed: *[1-9]' test-output.txt; then
            echo "::error::No tests were discovered - the suite reported success without running anything."
            exit 1
          fi

      - name: Check formatting
        # EnforceCodeStyleInBuild is off so style never fails a local build.
        # CI is where .editorconfig is actually enforced.
        run: dotnet format Portfolio.sln --verify-no-changes --verbosity minimal

      - name: Check for vulnerable packages
        # Advisory only - a new CVE should not break an unrelated PR, but it
        # should be visible in the log.
        continue-on-error: true
        run: dotnet list Portfolio.sln package --vulnerable --include-transitive
