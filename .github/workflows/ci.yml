name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the token only needs to read the code.
permissions:
  contents: read

# CI has no side effects, so superseding an in-flight run on a new push is safe
# and avoids paying for work nobody will read.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Otherwise the job token is saved in .git/config, readable by every later
          # step: package build scripts during restore, and the deploy action's image.
          # Nothing here needs it there; the deploy action is given its token directly.
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # Deliberately not pinned to a patch version: global.json holds a
          # floor (8.0.100, rollForward latestMinor), so any 8.0.x SDK satisfies it.
          dotnet-version: "8.0.x"

      - name: Build and test
        uses: ./.github/actions/build-and-test

      - name: Check formatting
        # EnforceCodeStyleInBuild is off so style never fails a local build.
        # CI is where .editorconfig is actually enforced.
        run: dotnet format Portfolio.sln --verify-no-changes --verbosity minimal

      # Two levels, on purpose (#78):
      # - A package the solution's projects reference directly is checked during
      #   restore, and an advisory against one fails every build: CI, the deploy's
      #   test gate, Azure's build and local ones. TreatWarningsAsErrors turns NuGet's
      #   NU1901-NU1904 into errors, and NU1900 too: if the advisory data cannot be
      #   fetched, the build stops rather than going ahead unchecked. The way out is
      #   normally merging Dependabot's security pull request. When none comes - no
      #   fixed version yet, or the fix is a major version dependabot.yml ignores - a
      #   NuGetAuditSuppress item for that one advisory URL in Directory.Build.props,
      #   with the reason and a date to look again, lets builds through.
      # - Not covered by that: indirect packages (NuGetAuditMode is "direct" on the
      #   .NET 8 SDK), and the WorkerExtensions project the Functions SDK generates for
      #   the host's extensions, which is outside the solution and exempt from
      #   warnings-as-errors. This step lists both, after the build has generated it,
      #   and turns a finding into a warning on the run. dotnet list exits 0 when it
      #   finds something, so a finding used to sit in a green log; pipefail makes a
      #   scan that fails to run fail the step instead of passing as a clean one.
      - name: Check indirect and host extension packages for advisories
        run: |
          set -o pipefail
          # Quiet and allowed to find nothing, so the message below says why the step failed.
          extensions=$(find src/Portfolio.Api/obj/Release -name WorkerExtensions.csproj 2>/dev/null | head -n 1 || true)
          if [ -z "$extensions" ]; then
            echo "::error::No generated WorkerExtensions.csproj under src/Portfolio.Api/obj/Release, so the host's extensions cannot be checked."
            exit 1
          fi

          {
            dotnet list Portfolio.sln package --vulnerable --include-transitive
            dotnet list "$extensions" package --vulnerable --include-transitive
          } | tee vulnerable.txt

          if grep -q 'has the following vulnerable packages' vulnerable.txt; then
            echo "::warning title=Vulnerable package::A package this site or its Functions host depends on has a known advisory. See this step's log; the fix is usually Dependabot's security pull request, or a newer version of the package that brings it in."
          fi
