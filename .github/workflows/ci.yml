name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the token only needs to read the code.
permissions:
  contents: read

# CI has no side effects, so superseding an in-flight run on a new push is safe
# and avoids paying for work nobody will read.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Otherwise the job token is saved in .git/config, readable by every later
          # step: package build scripts during restore, and the deploy action's image.
          # Nothing here needs it there; the deploy action is given its token directly.
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # Deliberately not pinned to a patch version: global.json holds a
          # floor (8.0.100, rollForward latestMinor), so any 8.0.x SDK satisfies it.
          dotnet-version: "8.0.x"

      - name: Build and test
        uses: ./.github/actions/build-and-test

      - name: Check formatting
        # EnforceCodeStyleInBuild is off so style never fails a local build.
        # CI is where .editorconfig is actually enforced.
        run: dotnet format Portfolio.sln --verify-no-changes --verbosity minimal

      # Two levels, on purpose (#78):
      # - A package this site references directly is checked during restore, and an
      #   advisory against one fails every build: CI, the deploy's test gate, Azure's
      #   build and local ones. TreatWarningsAsErrors turns NuGet's NU1901-NU1904 into
      #   errors. So a vulnerable package is never deployed; merging Dependabot's
      #   security pull request is what unblocks it.
      # - Indirect packages are not in that check (NuGetAuditMode is "direct" on the
      #   .NET 8 SDK). This step lists them too, and turns a finding into a warning on
      #   the run. The list command itself exits 0 either way, so on its own a finding
      #   only sat in a green log.
      - name: Check indirect packages for advisories
        run: |
          dotnet list Portfolio.sln package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q 'has the following vulnerable packages' vulnerable.txt; then
            echo "::warning title=Vulnerable package::A package this site depends on has a known advisory. See this step's log; the fix is usually Dependabot's security pull request, or a newer version of the package that brings it in."
          fi
