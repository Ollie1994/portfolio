name: Close preview environment

# pull_request_target rather than pull_request: the latter does not run while a
# pull request has a merge conflict, so closing a conflicted one left its preview
# behind with nothing to show it. No branch filter either, since a pull request can
# be moved off main after its preview was created. Both were reproduced in #43, and
# this was seen to remove both.
#
# This event runs with access to secrets. NEVER check out or run anything from the
# pull request here: the job only tells Azure which number to remove.
on:
  pull_request_target:
    types: [closed]

permissions: {} # authenticates with the deployment token only

# The same group as the deploy workflow, so a close waits for a deploy still in
# flight instead of running first and leaving its environment behind.
concurrency:
  group: swa-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  close_pull_request_job:
    # Must run for every pull request the deploy job could have created a preview
    # for. So this checks only who opened it and whether it is from a fork, as the
    # deploy job does, and never github.actor, since one person can trigger the
    # deploy and another the close. Written as exclusions so that a missing value
    # means the cleanup runs; with nothing to remove, it does nothing.
    #
    # Dependabot is excluded because GitHub withholds secrets from runs it triggers
    # on its own pull requests, so the close would have no token. That is safe only
    # because the deploy job never creates a preview for them.
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      # Pinned to a commit, as every action here is, so a moved or hijacked tag
      # cannot change what runs with the deployment token. Limit: this action builds
      # from mcr.microsoft.com/appsvc/staticappsclient:stable, a tag Microsoft moves,
      # so the deploy client itself is not frozen - only the action around it.
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_COAST_0312A8E0F }}
          action: "close"

      # The action exits 0 when it finds nothing to close, so a green tick alone
      # says nothing. Removed and never-created previews both answer 404.
      - name: Confirm the preview is gone
        env:
          URL: https://ambitious-coast-0312a8e0f-${{ github.event.pull_request.number }}.eastus2.7.azurestaticapps.net/
        run: |
          for attempt in $(seq 1 12); do
            code=$(curl -s -o /dev/null -m 20 -w '%{http_code}' "$URL" || true)
            if [ "$code" = "404" ]; then
              echo "$URL answers 404."
              exit 0
            fi
            sleep 10
          done
          echo "::error::$URL did not answer 404 (last: $code). If its environment is still there, it holds one of the three on the free tier."
          exit 1
