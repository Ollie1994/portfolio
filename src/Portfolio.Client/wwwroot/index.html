<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Oliwer Karlsson — Fullstack Developer</title>
    <!-- No meta description here: each page sets its own with <HeadContent>, and one
         here as well would give every project page two. The cost: a crawler that does
         not run JavaScript finds no description and makes up a snippet. Google and Bing
         say they run it before indexing; not verified for this site. Link previews read
         og:description below, which is unaffected. -->
    <base href="/" />

    <!--
        Social preview. Blazor renders client-side, so a scraper only ever sees this
        file — there is one card for the whole site, not one per route. og:image must
        be an absolute URL; relative paths are ignored by every major scraper.

        The image is rendered from tools/og-image. Platforms cache it by URL, so bump
        ?v= on og:image whenever it changes, or old shares keep the old card.

        twitter:card is the one Twitter tag without an og: equivalent. Its title,
        description and image fall back to the og: tags, so they are not repeated.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Oliwer Karlsson" />
    <meta property="og:title" content="Oliwer Karlsson — Fullstack Developer" />
    <meta property="og:description" content="Each project written up with the reasoning behind it — what I built and why it's built that way. C#, JavaScript, Java and TypeScript." />
    <meta property="og:url" content="https://ambitious-coast-0312a8e0f.7.azurestaticapps.net/" />
    <meta property="og:image" content="https://ambitious-coast-0312a8e0f.7.azurestaticapps.net/img/og-image.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Oliwer Karlsson — Fullstack Developer, Gothenburg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link href="Portfolio.Client.styles.css" rel="stylesheet" />
    <noscript><link rel="stylesheet" href="css/noscript.css" /></noscript>
</head>

<body>
    <!--
        Without JavaScript nothing below renders, on any route: the project pages need
        it too, so this links to things that work without it rather than to them.

        Not covered: browsers that run JavaScript but block WebAssembly, such as iOS
        Lockdown Mode or Edge's strict security mode. <noscript> does not apply there,
        so those visitors still get the spinner and then the error bar.
    -->
    <noscript>
        <main class="container noscript">
            <h1>Oliwer Karlsson</h1>
            <p>
                Fullstack developer in Gothenburg. This site is built with Blazor
                WebAssembly, so it needs JavaScript to run. Without it, here is where
                to find my work:
            </p>
            <ul>
                <li><a href="https://vararmaten.vercel.app">Väm</a>, a map of Gothenburg's food trucks, in soft launch (<a href="https://github.com/Ollie1994/whereisfood">source</a>)</li>
                <li><a href="https://github.com/Ollie1994/portfolio">The source of this site</a></li>
                <li><a href="https://github.com/Ollie1994/kahoot_clone_v5">A real-time quiz app</a></li>
                <li><a href="https://github.com/Ollie1994">Everything else on GitHub</a>, and <a href="https://www.linkedin.com/in/oliwer-karlsson-242b38323/">LinkedIn</a></li>
            </ul>
            <p>Or email me at <a href="mailto:oliwer.carlsson.jobb@gmail.com">oliwer.carlsson.jobb@gmail.com</a>.</p>
        </main>
    </noscript>

    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <!-- A button, not an <a> without href, so it can be reached by keyboard. Blazor
             finds it by the dismiss class alone. -->
        <button type="button" class="dismiss" aria-label="Dismiss">×</button>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
